services:
  postgres:
    image: postgres:16
    container_name: pharmaguard-api-postgres
    restart: always
    environment:
      POSTGRES_DB: pharmaguard
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pharmaguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  pharmaguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rafambrito/pharmaguard-api:latest
    container_name: pharmaguard-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmaguard
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      INTELLIGENCE_ENABLED: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  pharmaguard-ui:
    build:
      context: ../pharmaguard-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: rafambrito/pharmaguard-ui:latest
    container_name: pharmaguard-ui
    restart: always
    depends_on:
      - pharmaguard-api
    ports:
      - "8081:80"

volumes:
  postgres_data:
    driver: local
