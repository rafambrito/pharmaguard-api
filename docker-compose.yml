services:
  postgres:
    image: postgres:16
    container_name: pharmaguard-api-postgres
    restart: always
    environment:
      POSTGRES_DB: pharmaguard
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pharmaguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pharmaguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pharmaguard-ollama
    restart: always
    environment:
      OLLAMA_MODEL: llama3.2:1b
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-entrypoint.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    networks:
      - pharmaguard
    # O DNS herdado do host pode ser IPv6-only, inalcancavel na rede bridge.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Exposta apenas para diagnostico local; a API usa a rede interna.
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.2:1b"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  pharmaguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rafambrito/pharmaguard-api:latest
    container_name: pharmaguard-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmaguard
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      INTELLIGENCE_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    networks:
      - pharmaguard
    ports:
      - "8080:8080"

  pharmaguard-ui:
    build:
      context: ../pharmaguard-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    image: rafambrito/pharmaguard-ui:latest
    container_name: pharmaguard-ui
    restart: always
    depends_on:
      - pharmaguard-api
    networks:
      - pharmaguard
    ports:
      - "8081:80"

networks:
  pharmaguard:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
