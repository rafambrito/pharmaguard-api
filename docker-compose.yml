services:
  postgres:
    image: postgres:16
    container_name: pharmaguard-api-postgres
    restart: always
    environment:
      POSTGRES_DB: pharmaguard
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pharmaguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  pharmaguard-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmaguard-api/app:latest
    container_name: pharmaguard-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pharmaguard
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  postgres_data:
    driver: local
