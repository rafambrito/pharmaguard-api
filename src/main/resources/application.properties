spring.application.name=pharmaguard-api
spring.messages.basename=message

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

resilience.retry.scheduler.max-attempts=3
resilience.retry.scheduler.backoff=500ms
resilience.circuit-breaker.scheduler.failure-threshold=3
resilience.circuit-breaker.scheduler.open-duration=30s
resilience.timeout.scheduler=30s

intelligence.enabled=${INTELLIGENCE_ENABLED:true}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:moondream}
ollama.timeout=${OLLAMA_TIMEOUT:90s}
resilience.retry.intelligence.max-attempts=2
resilience.retry.intelligence.backoff=200ms
resilience.circuit-breaker.intelligence.failure-threshold=2
resilience.circuit-breaker.intelligence.open-duration=30s
resilience.bulkhead.intelligence.max-concurrent-calls=2
resilience.bulkhead.scheduler.max-concurrent-calls=1

security.jwt.secret=UGhhcm1hR3VhcmRBUElKV1RTZWNyZXRLZXlGb3JIbWFjU2hhMjU2
security.jwt.access-token-validity-seconds=3600
security.jwt.refresh-token-validity-seconds=1209600
