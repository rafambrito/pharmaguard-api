openapi: 3.0.3
info:
  title: PharmaGuard API - Modulo Auth - Usuarios
  version: "1.0.0"
  description: Contrato OpenAPI para operacoes CRUD de usuarios
servers:
  - url: http://localhost:8080
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autenticar
      operationId: autenticar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutenticarRequest"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Requisicao invalida

  /api/v1/auth/definir-senha:
    post:
      tags:
        - Auth
      summary: Definir senha
      operationId: definirSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinirSenhaRequest"
      responses:
        "204":
          description: Senha definida com sucesso
        "400":
          description: Requisicao invalida

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Renovar token
      operationId: renovarToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenovarSessaoRequest"
      responses:
        "200":
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Requisicao invalida

  /api/v1/usuarios:
    post:
      tags:
        - Usuarios
      summary: Criar usuario
      operationId: criarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarUsuarioRequest"
      responses:
        "201":
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          description: Dados invalidos
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      operationId: listarUsuarios
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponse"

  /api/v1/usuarios/{id}:
    get:
      tags:
        - Usuarios
      summary: Buscar usuario por id
      operationId: buscarUsuarioPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "404":
          description: Usuario nao encontrado
    put:
      tags:
        - Usuarios
      summary: Atualizar usuario
      operationId: atualizarUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarUsuarioRequest"
      responses:
        "200":
          description: Usuario atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          description: Dados invalidos
        "404":
          description: Usuario nao encontrado
    delete:
      tags:
        - Usuarios
      summary: Remover usuario
      operationId: removerUsuario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Usuario removido com sucesso
        "404":
          description: Usuario nao encontrado

components:
  schemas:
    AutenticarRequest:
      type: object
      required:
        - usuario
        - senha
      properties:
        usuario:
          type: string
          example: admin
        senha:
          type: string
          example: Senha@123

    DefinirSenhaRequest:
      type: object
      required:
        - login
        - senha
        - confirmarSenha
      properties:
        login:
          type: string
          example: admin
        senha:
          type: string
          example: Senha@123
        confirmarSenha:
          type: string
          example: Senha@123

    RenovarSessaoRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          example: token-valido

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: access-ana
        refreshToken:
          type: string
          example: refresh-ana
        tokenType:
          type: string
          example: Bearer

    CriarUsuarioRequest:
      type: object
      required:
        - nome
        - email
        - login
        - tipo
        - senha
      properties:
        nome:
          type: string
          example: Joao da Silva
        email:
          type: string
          format: email
          example: joao@pharmaguard.com
        login:
          type: string
          example: joao
        tipo:
          type: string
          maxLength: 50
          example: COLABORADOR
        senha:
          type: string
          minLength: 6
          example: Senha@123
        status:
          type: string
          enum:
            - ATIVO
            - INATIVO
            - BLOQUEADO
          example: ATIVO

    AtualizarUsuarioRequest:
      type: object
      required:
        - nome
        - email
        - login
      properties:
        nome:
          type: string
          example: Joao da Silva
        email:
          type: string
          format: email
          example: joao@pharmaguard.com
        login:
          type: string
          example: joao
        status:
          type: string
          enum:
            - ATIVO
            - INATIVO
            - BLOQUEADO
          example: ATIVO

    PerfilResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        nome:
          type: string
        descricao:
          type: string
        ativo:
          type: boolean

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        login:
          type: string
        tipo:
          type: string
        status:
          type: string
        perfis:
          type: array
          items:
            $ref: "#/components/schemas/PerfilResponse"
        dataCriacao:
          type: string
          format: date-time
          nullable: true
        dataUltimaAlteracao:
          type: string
          format: date-time
          nullable: true
