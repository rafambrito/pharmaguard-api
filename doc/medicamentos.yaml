openapi: 3.0.3
info:
  title: PharmaGuard API - Modulo Inventory - Medicamentos
  version: "1.0.0"
  description: Contrato OpenAPI para operacoes CRUD de categorias, unidades de medida, medicamentos e lotes
servers:
  - url: http://localhost:8080
paths:

  /api/v1/categorias:
    post:
      tags:
        - Categorias
      summary: Criar categoria
      operationId: criarCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarCategoriaRequest"
      responses:
        "201":
          description: Categoria criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "409":
          description: Categoria ja cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags:
        - Categorias
      summary: Listar categorias
      operationId: listarCategorias
      responses:
        "200":
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaResponse"

  /api/v1/categorias/{id}:
    get:
      tags:
        - Categorias
      summary: Buscar categoria por id
      operationId: buscarCategoriaPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "404":
          description: Categoria nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
        - Categorias
      summary: Atualizar categoria
      operationId: atualizarCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarCategoriaRequest"
      responses:
        "200":
          description: Categoria atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "404":
          description: Categoria nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Categoria ja cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - Categorias
      summary: Remover categoria
      operationId: removerCategoria
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Categoria removida com sucesso
        "404":
          description: Categoria nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/unidades-medida:
    post:
      tags:
        - Unidades de Medida
      summary: Criar unidade de medida
      operationId: criarUnidadeMedida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarUnidadeMedidaRequest"
      responses:
        "201":
          description: Unidade de medida criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnidadeMedidaResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "409":
          description: Unidade de medida ja cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags:
        - Unidades de Medida
      summary: Listar unidades de medida
      operationId: listarUnidadesMedida
      responses:
        "200":
          description: Lista de unidades de medida
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnidadeMedidaResponse"

  /api/v1/unidades-medida/{id}:
    get:
      tags:
        - Unidades de Medida
      summary: Buscar unidade de medida por id
      operationId: buscarUnidadeMedidaPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Unidade de medida encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnidadeMedidaResponse"
        "404":
          description: Unidade de medida nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
        - Unidades de Medida
      summary: Atualizar unidade de medida
      operationId: atualizarUnidadeMedida
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarUnidadeMedidaRequest"
      responses:
        "200":
          description: Unidade de medida atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnidadeMedidaResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "404":
          description: Unidade de medida nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Unidade de medida ja cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - Unidades de Medida
      summary: Remover unidade de medida
      operationId: removerUnidadeMedida
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Unidade de medida removida com sucesso
        "404":
          description: Unidade de medida nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/medicamentos:
    post:
      tags:
        - Medicamentos
      summary: Criar medicamento
      operationId: criarMedicamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarMedicamentoRequest"
      responses:
        "201":
          description: Medicamento criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicamentoResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "404":
          description: Categoria ou unidade de medida nao encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Medicamento ja cadastrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags:
        - Medicamentos
      summary: Listar medicamentos
      operationId: listarMedicamentos
      responses:
        "200":
          description: Lista de medicamentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicamentoResponse"

  /api/v1/medicamentos/{id}:
    get:
      tags:
        - Medicamentos
      summary: Buscar medicamento por id
      operationId: buscarMedicamentoPorId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Medicamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicamentoResponse"
        "404":
          description: Medicamento nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
        - Medicamentos
      summary: Atualizar medicamento
      operationId: atualizarMedicamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarMedicamentoRequest"
      responses:
        "200":
          description: Medicamento atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicamentoResponse"
        "400":
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "404":
          description: Medicamento, categoria ou unidade de medida nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Medicamento ja cadastrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - Medicamentos
      summary: Remover medicamento
      operationId: removerMedicamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Medicamento removido com sucesso
        "404":
          description: Medicamento nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/medicamentos/{medicamentoId}/lotes:
    post:
      tags:
        - Lotes
      summary: Cadastrar lote
      operationId: cadastrarLote
      parameters:
        - name: medicamentoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastrarLoteRequest"
      responses:
        "201":
          description: Lote cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoteResponse"
        "400":
          description: Dados invalidos ou validade vencida
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetail"
        "404":
          description: Medicamento nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Lote ja cadastrado para este medicamento
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      tags:
        - Lotes
      summary: Listar lotes do medicamento
      operationId: listarLotesPorMedicamento
      parameters:
        - name: medicamentoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lista de lotes do medicamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoteResponse"
        "404":
          description: Medicamento nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/medicamentos/{medicamentoId}/lotes/{loteId}:
    get:
      tags:
        - Lotes
      summary: Buscar lote por id
      operationId: buscarLotePorId
      parameters:
        - name: medicamentoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: loteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Lote encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoteResponse"
        "404":
          description: Medicamento ou lote nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - Lotes
      summary: Remover lote
      operationId: removerLote
      parameters:
        - name: medicamentoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: loteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Lote removido com sucesso
        "404":
          description: Medicamento ou lote nao encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  schemas:

    CriarCategoriaRequest:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: Antibioticos
        descricao:
          type: string
          example: Medicamentos usados para combater infeccoes bacterianas

    AtualizarCategoriaRequest:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: Antibioticos
        descricao:
          type: string
          example: Medicamentos usados para combater infeccoes bacterianas
        ativo:
          type: boolean
          example: true

    CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
          nullable: true
        dataUltimaAlteracao:
          type: string
          format: date-time
          nullable: true

    CriarUnidadeMedidaRequest:
      type: object
      required:
        - nome
        - sigla
      properties:
        nome:
          type: string
          example: Miligrama
        sigla:
          type: string
          example: mg

    AtualizarUnidadeMedidaRequest:
      type: object
      required:
        - nome
        - sigla
      properties:
        nome:
          type: string
          example: Miligrama
        sigla:
          type: string
          example: mg
        ativo:
          type: boolean
          example: true

    UnidadeMedidaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        sigla:
          type: string
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
          nullable: true
        dataUltimaAlteracao:
          type: string
          format: date-time
          nullable: true

    CriarMedicamentoRequest:
      type: object
      required:
        - nome
        - apresentacao
        - categoriaId
        - unidadeMedidaId
        - criticidade
      properties:
        nome:
          type: string
          example: Amoxicilina
        apresentacao:
          type: string
          example: 500mg capsula
        descricao:
          type: string
          example: Antibiotico de amplo espectro
        categoriaId:
          type: integer
          format: int64
          example: 1
        unidadeMedidaId:
          type: integer
          format: int64
          example: 1
        criticidade:
          type: string
          enum:
            - BAIXA
            - MEDIA
            - ALTA
            - CRITICA
          example: MEDIA

    AtualizarMedicamentoRequest:
      type: object
      required:
        - nome
        - apresentacao
        - categoriaId
        - unidadeMedidaId
        - criticidade
      properties:
        nome:
          type: string
          example: Amoxicilina
        apresentacao:
          type: string
          example: 500mg capsula
        descricao:
          type: string
          example: Antibiotico de amplo espectro
        categoriaId:
          type: integer
          format: int64
          example: 1
        unidadeMedidaId:
          type: integer
          format: int64
          example: 1
        criticidade:
          type: string
          enum:
            - BAIXA
            - MEDIA
            - ALTA
            - CRITICA
          example: MEDIA
        ativo:
          type: boolean
          example: true

    MedicamentoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        apresentacao:
          type: string
        descricao:
          type: string
        categoria:
          $ref: "#/components/schemas/CategoriaResponse"
        unidadeMedida:
          $ref: "#/components/schemas/UnidadeMedidaResponse"
        criticidade:
          type: string
        ativo:
          type: boolean
        dataCriacao:
          type: string
          format: date-time
          nullable: true
        dataUltimaAlteracao:
          type: string
          format: date-time
          nullable: true

    CadastrarLoteRequest:
      type: object
      required:
        - numeroLote
        - dataValidade
        - quantidadeInicial
      properties:
        numeroLote:
          type: string
          example: LOT-2024-001
        dataValidade:
          type: string
          format: date
          example: "2026-12-31"
        quantidadeInicial:
          type: integer
          minimum: 1
          example: 100

    LoteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numeroLote:
          type: string
        dataValidade:
          type: string
          format: date
        quantidadeInicial:
          type: integer
        statusValidade:
          type: string
          enum:
            - VALIDO
            - PROXIMO_VENCIMENTO
            - VENCIDO
        medicamentoId:
          type: integer
          format: int64
        dataCriacao:
          type: string
          format: date-time
          nullable: true

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

    ValidationProblemDetail:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
